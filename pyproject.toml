[project]
name = "churn"
version = "0.1.0"
description = "Churn prediction pipeline for a telecom-style subscription business, built on a documented synthetic data generator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Taha Alami" }]
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "xgboost==2.1.2",
    "imbalanced-learn==0.12.4",
    "mlflow==2.17.2",
    "shap==0.46.0",
    "matplotlib==3.9.2",
    "pyyaml==6.0.2",
    "pyarrow==17.0.0",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
    "pre-commit==4.0.1",
    "jupyter==1.1.1",
    "nbclient==0.10.0",
    "ipykernel==6.29.5",
]
serving = [
    "fastapi==0.115.5",
    "uvicorn==0.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["churn"]
