name: CI

on:
  push:
    branches: [main, portfolio-polish]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate a tiny synthetic sample
        env:
          CHURN_N_CUSTOMERS: "600"
        run: python -m churn.data.synthetic

      - name: Run the full training pipeline end-to-end on the tiny sample
        env:
          CHURN_N_CUSTOMERS: "600"
        run: python -m churn.modeling.train

      - name: Run batch prediction on the tiny sample
        run: python -m churn.modeling.predict

      - name: Verify pipeline artifacts were produced
        run: |
          test -f data/raw/customers.parquet
          test -f models/model.joblib
          test -f reports/train_results.json
          test -f reports/calibration_curve.png
          test -f data/scored.parquet
          echo "Smoke test artifacts verified."
