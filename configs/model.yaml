# Hyperparameters and thresholds for the churn pipeline.
# Nothing in src/churn/modeling should hardcode a magic number that belongs here.

split:
  test_size: 0.2
  random_seed: 42

cv:
  n_splits: 5
  random_seed: 42

imbalance:
  # RandomOverSampler is applied INSIDE the CV/train pipeline (fit on the
  # training fold only) to avoid leaking oversampled duplicates into
  # validation/test data. Chosen over class_weight because it also lets the
  # baseline logistic regression and the main XGBoost model share the exact
  # same resampling step, making the comparison between them apples-to-apples.
  strategy: random_oversample
  random_seed: 42

baseline_model:
  type: logistic_regression
  max_iter: 1000
  random_seed: 42

main_model:
  type: xgboost
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0
  eval_metric: aucpr
  random_seed: 42

calibration:
  method: isotonic
  cv: 3

evaluation:
  decision_threshold: 0.5
